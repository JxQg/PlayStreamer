[workspace]
members = ["crates/core", "src-tauri"]
exclude = ["vendor/glib-0.18.5", "tools/glib-security"]
default-members = ["crates/core"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }

[patch.crates-io]
glib = { path = "vendor/glib-0.18.5" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
