name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  glib-security:
    name: Optimized glib security regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/glib-security
      - name: Install GLib development libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-dev pkg-config
      - name: Verify upstream variant iterator tests with optimizations
        run: cargo test --manifest-path tools/glib-security/Cargo.toml --release --locked --lib

  windows:
    name: Windows desktop and core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/test-release.mjs
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-network-interfaces.ps1
      - run: node scripts/prepare-sidecar.mjs
      - run: pnpm typecheck
      - run: pnpm build
      - run: cargo fmt --all --check
      - run: cargo clippy --locked -p playstreamer-core --all-targets -- -D warnings
      - run: cargo test --locked -p playstreamer-core
      - name: Install FFmpeg for synthetic stream verification
        run: choco install ffmpeg --no-progress -y
      - name: Verify MediaMTX with a synthetic audio/video stream
        shell: pwsh
        run: |
          $env:PLAYSTREAMER_MEDIAMTX = (Resolve-Path 'src-tauri/binaries/mediamtx-x86_64-pc-windows-msvc.exe').Path
          # Killing a Chocolatey shim leaves the real publisher running. Launch its target directly.
          $ffmpegBinary = Join-Path $env:ChocolateyInstall 'lib/ffmpeg/tools/ffmpeg/bin/ffmpeg.exe'
          $env:PLAYSTREAMER_FFMPEG = (Resolve-Path -LiteralPath $ffmpegBinary -ErrorAction Stop).Path
          Write-Output "Synthetic publisher: $env:PLAYSTREAMER_FFMPEG"
          cargo test --locked -p playstreamer-core --test media_integration -- --ignored --test-threads=1
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml

  macos-core:
    name: macOS core compatibility
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked -p playstreamer-core
      - run: cargo test --locked -p playstreamer-core
